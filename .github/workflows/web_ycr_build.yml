name: Build and Push Web to Yandex Container Registry

on:
  workflow_dispatch:
    inputs:
      vite_demo:
        description: "VITE_DEMO (1|0)"
        required: true
        default: "0"
      vite_api_url:
        description: "VITE_API_URL (backend base URL)"
        required: true
        default: "https://api.example.com"
  push:
    branches:
      - main
    paths:
      - 'web/**'

env:
  IMAGE_NAME: photoguide-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YC CLI (no external actions)
        run: |
          set -euxo pipefail
          sudo curl -sSL -o /usr/local/bin/yc 'https://storage.yandexcloud.net/yandexcloud-yc/release/latest/linux/amd64/yc'
          sudo chmod +x /usr/local/bin/yc
          yc --version

      - name: Configure YC profile and context
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          set -euxo pipefail
          echo "$YC_SA_KEY_JSON" > sa-key.json
          yc config profile create ci || true
          yc config set profile ci
          yc config set service-account-key sa-key.json
          if [ -n "${{ secrets.YC_CLOUD_ID }}" ]; then yc config set cloud-id "${{ secrets.YC_CLOUD_ID }}"; fi
          if [ -n "${{ secrets.YC_FOLDER_ID }}" ]; then yc config set folder-id "${{ secrets.YC_FOLDER_ID }}"; fi
          yc config list

      - name: Login to Yandex Container Registry
        run: |
          set -euxo pipefail
          docker login -u iam -p "$(yc iam create-token)" cr.yandex

      - name: Compute image tag
        id: meta
        run: |
          set -euxo pipefail
          SHA=${GITHUB_SHA::7}
          if [ -n "${{ github.event.inputs.vite_demo }}" ]; then DEMO=${{ github.event.inputs.vite_demo }}; else DEMO=1; fi
          if [ -n "${{ github.event.inputs.vite_api_url }}" ]; then API=${{ github.event.inputs.vite_api_url }}; else API=""; fi
          echo "tag=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${SHA}" >> $GITHUB_OUTPUT
          echo "latest=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT
          echo "demo=$DEMO" >> $GITHUB_OUTPUT
          echo "api=$API" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            VITE_DEMO=${{ steps.meta.outputs.demo }}
            VITE_API_URL=${{ steps.meta.outputs.api }}

      - name: Ensure serverless container exists
        run: |
          set -euxo pipefail
          yc serverless container get --name taskflow-web >/dev/null 2>&1 || yc serverless container create --name taskflow-web

      - name: Deploy serverless revision
        run: |
          set -euxo pipefail
          ARGS=(
            --container-name taskflow-web
            --image "${{ steps.meta.outputs.latest }}"
            --cores 1 --memory 256m --execution-timeout 10s --concurrency 16
            --environment VITE_DEMO=${{ steps.meta.outputs.demo }},VITE_API_URL=${{ steps.meta.outputs.api }}
          )
          if [ -n "${{ secrets.YC_SA_ID }}" ]; then ARGS+=( --service-account-id "${{ secrets.YC_SA_ID }}" ); fi
          yc serverless container revision deploy "${ARGS[@]}"

      - name: Allow public access
        run: |
          set -euxo pipefail
          yc serverless container allow-unauthenticated-invoke --name taskflow-web || true

      - name: Output URL
        id: url
        run: |
          URL=$(yc serverless container get --name taskflow-web --format json | python3 -c 'import sys,json;print(json.load(sys.stdin)["url"])')
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "Web URL: ${URL}" >> $GITHUB_STEP_SUMMARY

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Also tagged: ${{ steps.meta.outputs.latest }}" >> $GITHUB_STEP_SUMMARY
