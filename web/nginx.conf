server {
	listen 80;
	server_name _;

	# Serve static files
	root   /usr/share/nginx/html;
	index  index.html;

	# Gzip basic
	gzip on;
	gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml text/javascript image/svg+xml;

	# Expose runtime config
	location = /config.js {
		add_header Cache-Control "no-store";
	}

	# Proxy API to backend container (docker-compose service "api")
	location /api {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
		proxy_connect_timeout 30s;
		proxy_pass http://api:8000;
	}

	# Try file, else route to SPA
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Cache assets aggressively
	location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico)$ {
		expires 30d;
		add_header Cache-Control "public, max-age=2592000";
		try_files $uri /index.html;
	}
}


