version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: taskflow-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: taskflow-web
    environment:
      VITE_DEMO: "0"
      VITE_API_URL: "http://api:8000"
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped
